version: "3.9"

# =================================================================
# Biography Platform - 一键部署
# 包含：bio(后端) + mysql + redis + rabbitmq + elasticsearch + minio
# 启动命令：docker compose up -d
# =================================================================

services:

  # ──────────── MySQL ────────────
  mysql:
    image: mysql:8.0
    container_name: bio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bio_password_2024}
      MYSQL_DATABASE: biography
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/biography.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-bio_password_2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bio-net

  # ──────────── Redis ────────────
  redis:
    image: redis:7-alpine
    container_name: bio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-bio_redis_2024} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bio_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bio-net

  # ──────────── RabbitMQ ────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: bio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理界面
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - bio-net

  # ──────────── Elasticsearch ────────────
  elasticsearch:
    image: elasticsearch:7.17.18
    container_name: bio-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - bio-net

  # ──────────── MinIO ────────────
  minio:
    image: minio/minio:latest
    container_name: bio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bio-net

  # ──────────── Bio Backend App ────────────
  bio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bio-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/biography?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bio_password_2024}
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-bio_redis_2024}
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Elasticsearch
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      # MinIO
      MIN_IO_ENDPOINT: http://minio:9000
      MIN_IO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MIN_IO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # JWT & 邮件（通过 .env 文件注入敏感配置）
      BIO_APP_JWT_SECRET: ${JWT_SECRET:-BioSecretKey_ChangeMe_InProduction}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    networks:
      - bio-net

# ──────────── 数据卷 ────────────
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  es_data:
  minio_data:
  app_logs:

# ──────────── 网络 ────────────
networks:
  bio-net:
    driver: bridge
